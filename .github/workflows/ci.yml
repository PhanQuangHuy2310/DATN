name: quality-gates

on:
  pull_request:
  push:
    branches: [main, huy, dat]

permissions:
  contents: read

jobs:
  secret-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v4
        with:
          python-version: "3.12"
      - run: python scripts/check_repository_secrets.py

  backend:
    runs-on: ubuntu-latest
    env:
      EAS_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: api_core/requirements.txt
      - run: python -m pip install --requirement api_core/requirements-dev.txt  # NOSONAR
      - run: ruff check api_core manage.py test_logger.py scripts tests
      - run: ruff check ai_service/*.py ai_service/routers/*.py
      - run: ruff format --check api_core manage.py test_logger.py scripts
      - run: python -m pip_audit --requirement api_core/requirements.txt
      - run: coverage run --source=api_core manage.py test -v 2
      - run: coverage xml
      - run: python -m unittest -v test_logger.py
      - run: python tests/run_tests.py
      - run: python -m compileall -q api_core ai_service manage.py test_logger.py scripts tests

  database:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: database/EAS_Supabase_SQL/validation/package-lock.json
      - working-directory: database/EAS_Supabase_SQL/validation
        run: npm ci --ignore-scripts
      - working-directory: database/EAS_Supabase_SQL/validation
        run: npm test

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            web_client/package-lock.json
            web_admin/package-lock.json
      - working-directory: web_client
        run: npm ci --ignore-scripts
      - working-directory: web_client
        run: npm audit --audit-level=high
      - working-directory: web_client
        run: npm run lint
      - working-directory: web_client
        run: npm test
      - working-directory: web_client
        run: npm run build
      - working-directory: web_admin
        run: npm ci --ignore-scripts
      - working-directory: web_admin
        run: npm audit --audit-level=high
      - working-directory: web_admin
        run: npm run build
      - name: Employee bundle excludes admin screens
        run: python3 scripts/check_client_bundle.py
      - working-directory: web_client
        run: npm run playwright:install
      - working-directory: web_client
        run: npm run e2e
 
  ocr-smoke:
    # Real PaddleOCR on synthetic Vietnamese invoices (tests/ocr_smoke):
    # amount, date and vendor must be extracted correctly.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: ai_service/requirements-paddle.txt
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libgomp1 libglib2.0-0
      - run: python -m pip install -r ai_service/requirements-paddle.txt fastapi==0.162.0 starlette==1.10.0 pydantic==2.9.2 pydantic-settings==2.5.2 loguru==0.7.2 Pillow==13.0.0 httpx==0.27.2 python-multipart==0.0.33 joblib==1.4.2  # NOSONAR
      - name: OCR smoke test
        env:
          OCR_SMOKE_REQUIRED: "1"
        run: python -m unittest -v tests.ocr_smoke.test_ocr_invoices

  container-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup environment for compose validation
        run: |
          DB_PROTO="postgresql"
          DB_TARGET="db.invalid:5432/postgres?sslmode=require"
          echo "EAS_API_DATABASE_URL=${DB_PROTO}://ci_api:ci_only@${DB_TARGET}" >> "$GITHUB_ENV"
          echo "EAS_WORKER_DATABASE_URL=${DB_PROTO}://ci_worker:ci_only@${DB_TARGET}" >> "$GITHUB_ENV"
          echo "EAS_MOCK_DATABASE_URL=${DB_PROTO}://ci_mock:ci_only@${DB_TARGET}" >> "$GITHUB_ENV"
          echo "EAS_DJANGO_SECRET_KEY=ci-ephemeral-key-$(date +%s)" >> "$GITHUB_ENV"
          echo "EAS_SUPABASE_URL=https://ci-project.invalid" >> "$GITHUB_ENV"
          echo "INTERNAL_API_SECRET=ci-ephemeral-secret-$(date +%s)" >> "$GITHUB_ENV"
          echo "EAS_MOCK_API_SECRET=ci-ephemeral-mock-secret-$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/setup-python@v4
        with:
          python-version: "3.12"
      - run: python scripts/validate_env.py --file .env.example --profile compose --allow-placeholders
      - run: python scripts/validate_env.py --file api_core/.env.example --profile api --allow-placeholders
      - run: python scripts/validate_env.py --file api_core/.env.worker.example --profile worker --allow-placeholders
      - run: python scripts/validate_env.py --file web_client/.env.example --profile web --allow-placeholders
      - run: docker compose config --quiet
      - run: docker compose build api web

  documentation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: "3.12"
      - run: python scripts/validate_docs.py

  mobile:
    # Static analysis of the Flutter app (same SDK as local development).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@f2c4f6686ca8e8d6e6d0f28410eeef506ed66aff # v2.18.0
        with:
          flutter-version: "3.47.1"
          channel: stable
      - working-directory: mobile_app
        run: flutter pub get --enforce-lockfile
      - working-directory: mobile_app
        run: flutter analyze
