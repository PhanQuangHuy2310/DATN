server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  client_max_body_size 10m;
  proxy_read_timeout 60s;
  proxy_connect_timeout 10s;
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header Content-Security-Policy "default-src 'self'; connect-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'" always;
  # Employee portal: administration, operations and worker-only APIs are not
  # reachable through this ingress (the admin portal has its own nginx.conf).
  location ^~ /api/v1/admin/ { return 404; }
  location ^~ /api/v1/ops/ { return 404; }
  location ^~ /api/v1/internal/ { return 404; }
  location /api/ { proxy_pass http://api:8000; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $scheme; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; }
  location /health/ { proxy_pass http://api:8000; proxy_set_header Host $host; }
  location / { try_files $uri $uri/ /index.html; }
}
