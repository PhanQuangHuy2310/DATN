# =============================================================================
# API Gateway — Nginx Reverse Proxy (EAS)
# =============================================================================
# MỤC ĐÍCH:
#   Điểm vào backend thống nhất, phân phối traffic theo prefix:
#     /api/v1/auth/login → api_core   (rate limit chống brute force)
#     /api/v1/mock/*     → api_core   (8 hệ thống nguồn mock_*)
#     /api/*             → api_core   (Django — nghiệp vụ EAS, schema eas)
#     /ai/*              → ai_service (FastAPI — các model AI đã train)
#     /health/*          → api_core   (readiness/liveness Django)
#     /gateway/health    → chính gateway
#
# TẠI SAO DÙNG NGINX (không dùng Kong/Traefik):
#   - Đồ án P0 không cần service mesh; Nginx đủ cho rate limit, size limit,
#     correlation ID, security headers.
#   - Cấu hình dạng file → review được trong Pull Request, không phụ thuộc dashboard.
#
# MÔ HÌNH AI ĐI QUA GATEWAY (gateway KHÔNG chứa model, chỉ proxy):
#   /ai/classify/*      → TF-IDF + CalibratedClassifier (nlp_*.pkl)
#   /ai/risk/*          → XGBoost ensemble finance/hr/it/master (risk_model*.pkl)
#   /ai/auto-approve/*  → Rule engine dựa trên risk score
#   /ai/ocr/*           → PaddleOCR (vi) / Gemini Vision
#   /ai/summarize/*     → Gemini 1.5 Flash
#   Chi tiết: ai_service/AI_ARCHITECTURE.md
#
# BẢO MẬT /ai/*:
#   ai_service bắt buộc header X-Internal-Secret. Gateway KHÔNG tự chèn secret
#   (nếu chèn thì bất kỳ ai gọi được gateway cũng gọi được AI). Chỉ caller nội bộ
#   (api_core, worker) biết secret mới dùng được /ai/*.
# =============================================================================

worker_processes auto;
error_log /dev/stderr warn;
# pid nằm trên tmpfs /var/run (container read_only, chạy user nginx)
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/json;

    # Thư mục tạm phải nằm trên tmpfs /var/cache/nginx (root FS read-only)
    client_body_temp_path /var/cache/nginx/client_temp;
    proxy_temp_path       /var/cache/nginx/proxy_temp;
    fastcgi_temp_path     /var/cache/nginx/fastcgi_temp;
    uwsgi_temp_path       /var/cache/nginx/uwsgi_temp;
    scgi_temp_path        /var/cache/nginx/scgi_temp;

    # ── Correlation ID ── (map PHẢI nằm trong context http)
    # Giữ X-Correlation-ID của client nếu có, nếu không dùng $request_id của Nginx.
    map $http_x_correlation_id $correlation_id {
        default $http_x_correlation_id;
        ""      $request_id;
    }

    # ── Logging ── KHÔNG log Authorization, Cookie, body (tránh lộ PII/secret)
    log_format eas_log '$remote_addr [$time_local] "$request_method $uri" '
                       '$status $body_bytes_sent rt=$request_time '
                       'upstream=$upstream_addr cid=$correlation_id';
    access_log /dev/stdout eas_log;

    sendfile          on;
    tcp_nopush        on;
    keepalive_timeout 65;
    server_tokens     off;

    # ── Giới hạn kích thước ── 10MB khớp eas.attachment.size_bytes <= 10485760
    client_max_body_size  10m;
    client_body_timeout   30s;
    client_header_timeout 15s;

    gzip on;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_types application/json text/plain;

    # ── Rate limiting ── trả 429 thay vì 503 mặc định
    limit_req_status 429;
    limit_req_zone $binary_remote_addr zone=login_limit:10m  rate=5r/m;
    limit_req_zone $binary_remote_addr zone=upload_limit:10m rate=10r/m;
    limit_req_zone $binary_remote_addr zone=ai_limit:10m     rate=20r/m;
    limit_req_zone $binary_remote_addr zone=api_limit:10m    rate=60r/m;

    # ── Chỉ tin X-Forwarded-For từ mạng nội bộ Docker ──
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 10.0.0.0/8;
    real_ip_header   X-Forwarded-For;
    real_ip_recursive on;

    upstream api_core {
        server api:8000;
        keepalive 16;
    }

    upstream ai_service {
        server ai-service:8001;
        keepalive 8;
    }

    server {
        listen 8080;
        server_name _;

        # Security headers khai báo ở server level.
        # LƯU Ý: Nginx KHÔNG kế thừa add_header nếu location tự khai báo add_header,
        # nên các location bên dưới cố ý KHÔNG dùng add_header.
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options        "DENY" always;
        add_header Referrer-Policy        "strict-origin-when-cross-origin" always;
        add_header Cache-Control          "no-store" always;
        add_header X-Correlation-ID       $correlation_id always;

        # Header chung gửi xuống upstream
        proxy_http_version 1.1;
        proxy_set_header Connection        "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Correlation-ID  $correlation_id;
        proxy_connect_timeout 10s;
        proxy_read_timeout    30s;
        proxy_send_timeout    30s;

        # ── 1. Health của chính gateway ──
        location = /gateway/health {
            access_log off;
            return 200 '{"status":"ok","service":"api-gateway"}';
        }

        # ── 2. Health của Django (dùng cho readiness) ──
        location /health/ {
            access_log off;
            proxy_pass http://api_core;
        }

        # ── 3. Login — rate limit nghiêm ngặt (Django cũng có lockout riêng) ──
        location = /api/v1/auth/login {
            limit_req zone=login_limit burst=3 nodelay;
            proxy_pass http://api_core;
        }

        # ── 4. Upload đính kèm ──
        location ~ ^/api/v1/.+/attachments {
            limit_req zone=upload_limit burst=5 nodelay;
            proxy_read_timeout 60s;
            proxy_pass http://api_core;
        }

        # ── 5. Mock sources — 8 schema mock_* (đọc-only qua role eas_api) ──
        location /api/v1/mock/ {
            limit_req zone=api_limit burst=20 nodelay;
            proxy_read_timeout 15s;
            proxy_pass http://api_core;
        }

        # ── 6. API nghiệp vụ chính (schema eas) ──
        location /api/ {
            limit_req zone=api_limit burst=20 nodelay;
            proxy_pass http://api_core;
        }

        # ── 7. AI Service — các model đã train ──
        # Timeout dài hơn vì OCR / Gemini có thể mất vài chục giây.
        location /ai/ {
            limit_req zone=ai_limit burst=10 nodelay;
            proxy_connect_timeout 15s;
            proxy_read_timeout    120s;
            proxy_send_timeout    60s;
            proxy_pass http://ai_service;
        }

        # ── 8. Swagger của AI service (Bảo mật: Chỉ cho phép nội bộ Docker/localhost) ──
        location ~ ^/(docs|redoc|openapi\.json)$ {
            allow 127.0.0.1;
            allow 10.0.0.0/8;
            allow 172.16.0.0/12;
            deny all;
            proxy_pass http://ai_service;
        }

        # ── Mặc định: 404 JSON ──
        location / {
            return 404 '{"error":"NOT_FOUND","message":"Route khong ton tai tren gateway"}';
        }
    }
}
