# Rate limits at the portal edge (the portals proxy straight to the API, so the
# gateway limits do not apply). This file is included in the http context.
limit_req_zone $binary_remote_addr zone=admin_auth:10m   rate=5r/m;
limit_req_zone $binary_remote_addr zone=admin_upload:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=admin_api:10m    rate=20r/s;
limit_req_status 429;

server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;
  autoindex off;
  client_max_body_size 10m;
  proxy_read_timeout 60s;
  proxy_connect_timeout 10s;
  # Security headers for every response, including static assets. Locations
  # below must not declare add_header, or nginx drops these inherited ones.
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; font-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'" always;

  # Worker-only endpoints are called over the Docker network, never via a portal.
  location ^~ /api/v1/internal/ { return 404; }

  # Never fall back to index.html for secrets, VCS data or dumps: answer 404.
  location ~ /\.(?!well-known/) { return 404; }
  location ~* \.(env|sql|bak|backup|dump|log|ini|conf|map|py|sh|ps1|cmd)$ { return 404; }
  location /assets/ { try_files $uri =404; }
  # Login, password change and reset: brute-force protection per client IP.
  location ~ ^/api/v1/auth/(login|password|change-password|password-reset/request)$ {
    limit_req zone=admin_auth burst=3 nodelay;
    proxy_pass http://api:8000; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $scheme; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }
  location ~ ^/api/v1/.+/attachments {
    limit_req zone=admin_upload burst=5 nodelay;
    proxy_pass http://api:8000; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $scheme; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }
  location /api/ {
    limit_req zone=admin_api burst=60 nodelay;
    proxy_pass http://api:8000; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $scheme; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }
  location /health/ { proxy_pass http://api:8000; proxy_set_header Host $host; }
  location / { try_files $uri $uri/ /index.html; }
}
